####################################################################
# /etc/nginx/nginx.conf — main config for the Theos deployment
#
# This is the top-level Nginx config (Debian/Ubuntu layout). It stays
# generic on purpose: the Theos-specific reverse proxy lives in
# deploy/nginx/theos.conf, which is installed as a separate server
# block under sites-available/sites-enabled (or conf.d).
#
# Install:
#   sudo cp deploy/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp deploy/nginx/theos.conf /etc/nginx/sites-available/theos.conf
#   sudo ln -s /etc/nginx/sites-available/theos.conf /etc/nginx/sites-enabled/theos.conf
#   sudo nginx -t && sudo systemctl reload nginx
####################################################################

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    # ─── Basic settings ────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    gzip_disable "msie6";
    # Note: text/event-stream is intentionally left out of gzip_types above,
    # so /api/chat (Server-Sent Events) is never buffered for compression —
    # that would defeat the token-by-token streaming UX.

    # ─── Site configs ──────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
