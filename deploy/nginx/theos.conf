####################################################################
# /etc/nginx/sites-available/theos.conf
#
# Reverse proxy for the Theos Node/Express app (server.js), which
# listens on 127.0.0.1:3000 by default (see ecosystem.config.cjs / PORT).
#
# Install:
#   sudo cp deploy/nginx/theos.conf /etc/nginx/sites-available/theos.conf
#   sudo ln -s /etc/nginx/sites-available/theos.conf /etc/nginx/sites-enabled/theos.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a TLS cert (recommended):
#   sudo certbot --nginx -d theos.example.com
#
# Replace "theos.example.com" below with the real domain, and set
# TRUST_PROXY=1 in the app's .env so Express trusts this proxy's
# X-Forwarded-For/Proto headers (used for rate limiting by client IP).
####################################################################

upstream theos_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─── HTTP: redirect to HTTPS, except ACME challenge ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name theos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: main site ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theos.example.com;

    ssl_certificate     /etc/letsencrypt/live/theos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Matches the express.json({ limit: '1mb' }) body cap in server.js.
    client_max_body_size 1m;

    access_log /var/log/nginx/theos.access.log main;
    error_log  /var/log/nginx/theos.error.log warn;

    # ─── Streaming chat proxy (Server-Sent Events) ────────────────
    # /api/chat streams the AI response token-by-token; buffering or
    # caching it here would break the live-typing UX and can trigger
    # gateway timeouts on long answers.
    location /api/chat {
        proxy_pass http://theos_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # ─── Everything else (static assets + JSON API + SPA fallback) ─
    location / {
        proxy_pass http://theos_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "keep-alive";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
